<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>pilas3d — web</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden;
               background: #101418; }
  canvas { display: block; }
  #estado { position: fixed; top: 8px; left: 10px; color: #8f8;
            font: 12px monospace; text-shadow: 0 1px 2px #000;
            pointer-events: none; white-space: pre; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud > div { position: absolute; font-family: monospace;
               white-space: pre; text-shadow: 1px 1px 2px #000; }
  .hud-p { opacity: .85; }
  .hud-b { background: #222; border: 1px solid #000;
           box-sizing: border-box; }
  .hud-b > i { display: block; height: 100%; background: #4c4; }
  .hud-g { background: #fff; color: #000; text-shadow: none;
           border: 2px solid #333; border-radius: 10px;
           padding: 6px 10px; transform: translate(-50%, -100%); }
</style>
</head>
<body>
<div id="estado">conectando…</div>
<div id="hud"></div>
<script type="module" src="cliente.js"></script>
</body>
</html>
