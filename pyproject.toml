[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilas3d"
version = "0.11.0"
description = "Motor de videojuegos 3D simple en español, inspirado en pilas-engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
dependencies = ["pyglet>=2.1,<3"]

[project.optional-dependencies]
fisica = ["pymunk>=7,<8"]
empaquetar = ["pyinstaller>=6"]

[project.scripts]
pilas3d = "pilas3d.interactivo:main"
pilas3d-editor = "pilas3d.editor:cli"
pilas3d-bloques = "pilas3d.bloques:cli"
pilas3d-ide = "pilas3d.ide:cli"
pilas3d-mapas = "pilas3d.mapa_editor:cli"
pilas3d-empaquetar = "pilas3d.empaquetar:cli"
pilas3d-init = "pilas3d.nuevo_juego:cli"

[tool.setuptools.packages.find]
include = ["pilas3d*"]

[tool.setuptools.package-data]
pilas3d = ["bloques_web/**/*", "bloques_web/**/**/*", "web/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
