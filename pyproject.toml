[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilas3d"
version = "0.1.0"
description = "Motor de videojuegos 3D simple en español, inspirado en pilas-engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LGPL-3.0-or-later" }
dependencies = ["pyglet>=2.1,<3"]

[tool.setuptools.packages.find]
include = ["pilas3d*"]
